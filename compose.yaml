name: rag-mvp

services:
  app:
    container_name: rag-mvp
    image: ${RAG_MVP_IMAGE:-rag-mvp:dev}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${RAG_MVP_APP_VERSION:-0.1.0}
        SOURCE_REVISION: ${RAG_MVP_SOURCE_REVISION:-unknown}
    user: "10001:10001"
    read_only: true
    restart: unless-stopped
    stop_grace_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    deploy:
      replicas: 1
    ports:
      - "${RAG_MVP_BIND_ADDRESS:-127.0.0.1}:${RAG_MVP_HOST_PORT:-8000}:${RAG_MVP_CONTAINER_PORT:-8000}"
    environment:
      RAG_MVP_SERVICE_VERSION: ${RAG_MVP_APP_VERSION:-0.1.0}
      RAG_MVP_ENVIRONMENT: production
      RAG_MVP_HOST: 0.0.0.0
      RAG_MVP_PORT: ${RAG_MVP_CONTAINER_PORT:-8000}
      RAG_MVP_DATA_ROOT: /var/lib/rag-mvp
      RAG_MVP_WORKBENCH_ENABLED: ${RAG_MVP_WORKBENCH_ENABLED:-true}
      RAG_MVP_PROVIDER_BACKEND: ${RAG_MVP_PROVIDER_BACKEND:-openai}
      RAG_MVP_OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      RAG_MVP_OPENAI_BASE_URL: ${RAG_MVP_OPENAI_BASE_URL:-https://api.openai.com/v1}
      RAG_MVP_OPENAI_SEND_DIMENSIONS: ${RAG_MVP_OPENAI_SEND_DIMENSIONS:-true}
      RAG_MVP_OPENAI_MAX_TOKENS_PARAMETER: ${RAG_MVP_OPENAI_MAX_TOKENS_PARAMETER:-max_completion_tokens}
      RAG_MVP_EMBEDDING_MODEL: ${RAG_MVP_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_MVP_EMBEDDING_DIMENSION: ${RAG_MVP_EMBEDDING_DIMENSION:-1536}
      RAG_MVP_GENERATION_MODEL: ${RAG_MVP_GENERATION_MODEL:-gpt-4.1-mini}
      RAG_MVP_RERANKING_MODEL: ${RAG_MVP_RERANKING_MODEL:-}
      RAG_MVP_OCR_ENABLED: ${RAG_MVP_OCR_ENABLED:-true}
      RAG_MVP_OCR_LANGUAGES: ${RAG_MVP_OCR_LANGUAGES:-chi_sim+eng}
      RAG_MVP_LOG_LEVEL: ${RAG_MVP_LOG_LEVEL:-INFO}
      RAG_MVP_TELEMETRY_EXPORTER: ${RAG_MVP_TELEMETRY_EXPORTER:-none}
      RAG_MVP_TELEMETRY_OTLP_TRACES_ENDPOINT: ${RAG_MVP_TELEMETRY_OTLP_TRACES_ENDPOINT:-}
      RAG_MVP_TELEMETRY_EXPORT_TIMEOUT_SECONDS: ${RAG_MVP_TELEMETRY_EXPORT_TIMEOUT_SECONDS:-5}
      RAG_MVP_PRICING_VERSION: ${RAG_MVP_PRICING_VERSION:-unconfigured}
      RAG_MVP_SERVER_SHUTDOWN_GRACE_SECONDS: ${RAG_MVP_SERVER_SHUTDOWN_GRACE_SECONDS:-4}
      RAG_MVP_SHUTDOWN_GRACE_SECONDS: ${RAG_MVP_SHUTDOWN_GRACE_SECONDS:-15}
    secrets:
      - source: openai_api_key
        target: openai_api_key
        mode: 0444
    volumes:
      - type: volume
        source: app_data
        target: /var/lib/rag-mvp
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /home/rag-mvp/.cache:size=128m,uid=10001,gid=10001,mode=0700
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - >-
          import os,urllib.request;
          urllib.request.urlopen(f'http://127.0.0.1:{os.environ.get("RAG_MVP_PORT", "8000")}/readyz', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

secrets:
  openai_api_key:
    file: ${RAG_MVP_OPENAI_API_KEY_SECRET_FILE:-./docker/provider-key.placeholder}

volumes:
  app_data:
    name: ${RAG_MVP_DATA_VOLUME:-rag-mvp-data}
